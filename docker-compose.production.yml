version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wordsto-postgres
    restart: always
    environment:
      POSTGRES_DB: wordsto_link
      POSTGRES_USER: wordsto
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - wordsto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordsto -d wordsto_link"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wordsto-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - wordsto-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: wordsto-app
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wordsto:${DB_PASSWORD}@postgres:5432/wordsto_link
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wordsto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://wordsto.link
    container_name: wordsto-frontend
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - wordsto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  wordsto-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: